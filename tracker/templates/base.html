<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}投资追踪{% endblock %} — 复盘系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script>
    const nativeFetch = window.fetch;
    window.fetch = function(input, init = {}) {
      const method = (init.method || 'GET').toUpperCase();
      if (method !== 'GET' && method !== 'HEAD') {
        const headers = new Headers(init.headers || {});
        headers.set('X-CSRFToken', document.querySelector('meta[name="csrf-token"]').content);
        init = {...init, headers};
      }
      return nativeFetch(input, init);
    };
    document.addEventListener('DOMContentLoaded', () => {
      const token = document.querySelector('meta[name="csrf-token"]').content;
      document.querySelectorAll('form[method="post"], form[method="POST"]').forEach(form => {
        if (form.querySelector('input[name="csrf_token"]')) return;
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'csrf_token';
        input.value = token;
        form.appendChild(input);
      });
    });
  </script>
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" href="{{ url_for('dashboard') }}">
      <i class="bi bi-graph-up-arrow me-2 text-success"></i>投资复盘系统
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-1">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'dashboard' %}active fw-semibold{% endif %}"
             href="{{ url_for('dashboard') }}">
            <i class="bi bi-house me-1"></i>仪表盘
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint in ('sessions','session_detail','add_session') %}active fw-semibold{% endif %}"
             href="{{ url_for('sessions') }}">
            <i class="bi bi-collection me-1"></i>分析会话
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint in ('recommendations','stock_detail') %}active fw-semibold{% endif %}"
             href="{{ url_for('recommendations') }}">
            <i class="bi bi-signpost-split me-1"></i>股票全流程
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint in ('themes','rotation','supply_chain') %}active fw-semibold{% endif %}"
             href="{{ url_for('themes') }}">
            <i class="bi bi-grid-3x3-gap me-1"></i>主题地图
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'monitor' %}active fw-semibold{% endif %}"
             href="{{ url_for('monitor') }}">
            <i class="bi bi-activity me-1"></i>监控
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint in ('knowledge','knowledge_detail','knowledge_add','knowledge_edit') %}active fw-semibold{% endif %}"
             href="{{ url_for('knowledge') }}">
            <i class="bi bi-journal-bookmark me-1"></i>知识库
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'agent_page' %}active fw-semibold{% endif %}"
             href="{{ url_for('agent_page') }}">
            <i class="bi bi-robot me-1"></i>AI 助手
          </a>
        </li>
        <!-- Notification bell -->
        <li class="nav-item position-relative">
          <button class="btn btn-sm notif-bell-btn" id="notifBellBtn" title="通知" onclick="toggleNotifDropdown(event)">
            <i class="bi bi-bell" style="font-size:1.05rem;"></i>
            <span id="notifBadge" class="notif-badge" style="display:none">0</span>
          </button>
          <div id="notifDropdown" class="notif-dropdown" style="display:none;">
            <div class="notif-header">
              <span class="fw-semibold" style="font-size:.85rem;">通知</span>
              <button class="btn btn-link btn-sm p-0 text-muted" style="font-size:.75rem;" onclick="markAllRead()">全部已读</button>
            </div>
            <div id="notifList" class="notif-list">
              <div class="notif-empty">暂无通知</div>
            </div>
          </div>
        </li>
        <li class="nav-item ms-1">
          <a class="btn btn-success btn-sm px-3 {% if request.endpoint == 'add_session' %}active{% endif %}"
             href="{{ url_for('add_session') }}">
            <i class="bi bi-plus-circle me-1"></i>新建会话
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container-fluid px-4 py-4" style="max-width:1400px;">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
    <div class="alert alert-{{ category }} alert-dismissible fade show py-2" role="alert"
         style="font-size:.875rem;">
      {{ msg }}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
let _notifOpen = false;

function toggleNotifDropdown(e) {
  e.stopPropagation();
  const dd = document.getElementById('notifDropdown');
  _notifOpen = !_notifOpen;
  dd.style.display = _notifOpen ? 'block' : 'none';
  if (_notifOpen) loadNotifications();
}

document.addEventListener('click', () => {
  if (_notifOpen) {
    _notifOpen = false;
    document.getElementById('notifDropdown').style.display = 'none';
  }
});

function loadNotifications() {
  fetch('/api/notifications')
    .then(r => r.json())
    .then(data => {
      const list = document.getElementById('notifList');
      if (!data.length) { list.innerHTML = '<div class="notif-empty">暂无通知</div>'; return; }
      const unreadIds = data.filter(n => !n.is_read).map(n => n.id);
      list.innerHTML = data.map(n => `
        <div class="notif-item ${n.is_read ? '' : 'unread'}" data-id="${n.id}">
          <div class="notif-title">${n.title}</div>
          <div class="notif-msg">${n.message}</div>
          <div class="notif-time">${n.created_at.slice(0,16)}</div>
        </div>`).join('');
      if (unreadIds.length) {
        fetch('/api/notifications/mark_read', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ids: unreadIds})
        }).then(() => updateBadge());
      }
    });
}

function markAllRead() {
  fetch('/api/notifications/mark_read', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'})
    .then(() => { updateBadge(); loadNotifications(); });
}

function updateBadge() {
  fetch('/api/notifications/count')
    .then(r => r.json())
    .then(d => {
      const badge = document.getElementById('notifBadge');
      if (d.count > 0) { badge.textContent = d.count > 99 ? '99+' : d.count; badge.style.display = 'block'; }
      else badge.style.display = 'none';
    });
}

updateBadge();
setInterval(updateBadge, 60000);
</script>
{% block scripts %}{% endblock %}
</body>
</html>
