x-agent-environment: &environment
  PORT: 5050
  TZ: Asia/Shanghai
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
  API_KEY: ${API_KEY:-}
  APP_USERNAME: ${APP_USERNAME:?Set APP_USERNAME}
  APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD}
  TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-}
  TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
  LONGBRIDGE_APP_KEY: ${LONGBRIDGE_APP_KEY:-}
  LONGBRIDGE_APP_SECRET: ${LONGBRIDGE_APP_SECRET:-}
  LONGBRIDGE_ACCESS_TOKEN: ${LONGBRIDGE_ACCESS_TOKEN:-}
  LONGBRIDGE_REGION: ${LONGBRIDGE_REGION:-cn}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
  LLM_FAST_MODEL: ${LLM_FAST_MODEL:-}
  LLM_STRONG_MODEL: ${LLM_STRONG_MODEL:-}
  LLM_REVIEW_MODEL: ${LLM_REVIEW_MODEL:-}
  LLM_INPUT_PRICE_PER_M: ${LLM_INPUT_PRICE_PER_M:-1}
  LLM_OUTPUT_PRICE_PER_M: ${LLM_OUTPUT_PRICE_PER_M:-2}
  LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1024}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
  AGENT_MAX_ITERATIONS: ${AGENT_MAX_ITERATIONS:-8}
  AGENT_DAILY_TOKEN_BUDGET: ${AGENT_DAILY_TOKEN_BUDGET:-200000}
  AGENT_RUN_TIMEOUT_SECONDS: ${AGENT_RUN_TIMEOUT_SECONDS:-90}
  AGENT_MORNING_ENABLED: ${AGENT_MORNING_ENABLED:-1}
  AGENT_VERSION: ${AGENT_VERSION:-investment-v1}
  FLASK_DEBUG: 0
services:
  tracker:
    build:
      context: ..
      dockerfile: tracker/Dockerfile
    ports:
      - "127.0.0.1:5050:5050"
    environment: *environment
    restart: unless-stopped
    volumes:
      - tracker-data:/app/data
  ai-monitor:
    build:
      context: ..
      dockerfile: tracker/Dockerfile
    command: ["python", "ai_monitor_worker.py"]
    environment: *environment
    restart: unless-stopped
    volumes:
      - tracker-data:/app/data
volumes:
  tracker-data:
