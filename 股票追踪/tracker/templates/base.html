<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}投资追踪{% endblock %} — 复盘系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" href="{{ url_for('dashboard') }}">
      <i class="bi bi-graph-up-arrow me-2 text-success"></i>投资复盘系统
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-1">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'dashboard' %}active fw-semibold{% endif %}"
             href="{{ url_for('dashboard') }}">
            <i class="bi bi-house me-1"></i>仪表盘
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint in ('sessions','session_detail','add_session') %}active fw-semibold{% endif %}"
             href="{{ url_for('sessions') }}">
            <i class="bi bi-collection me-1"></i>分析会话
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'recommendations' %}active fw-semibold{% endif %}"
             href="{{ url_for('recommendations') }}">
            <i class="bi bi-list-ul me-1"></i>所有推荐
          </a>
        </li>
        <li class="nav-item ms-1">
          <a class="btn btn-success btn-sm px-3 {% if request.endpoint == 'add_session' %}active{% endif %}"
             href="{{ url_for('add_session') }}">
            <i class="bi bi-plus-circle me-1"></i>新建会话
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container-fluid px-4 py-4" style="max-width:1400px;">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
    <div class="alert alert-{{ category }} alert-dismissible fade show py-2" role="alert"
         style="font-size:.875rem;">
      {{ msg }}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
