{% extends "base.html" %}
{% block title %}编辑会话{% endblock %}

{% block content %}
<div class="mb-3">
  <a href="{{ url_for('session_detail', session_id=session.id) }}" class="text-muted" style="font-size:.85rem;">
    <i class="bi bi-arrow-left me-1"></i>返回会话
  </a>
</div>

<div class="d-flex justify-content-between align-items-center mb-4">
  <h5 class="fw-bold mb-0">编辑分析会话</h5>
  <form method="post" action="{{ url_for('delete_session', session_id=session.id) }}"
        onsubmit="return confirm('确认删除这个会话？会话内的推荐记录会保留，但不再归属此会话。')">
    <button type="submit" class="btn btn-outline-danger btn-sm">
      <i class="bi bi-trash me-1"></i>删除会话
    </button>
  </form>
</div>

<div class="row">
  <div class="col-lg-8">
    <form method="post">
      <div class="card">
        <div class="card-header"><i class="bi bi-pencil me-1"></i>基本信息</div>
        <div class="card-body p-3 row g-3">
          <div class="col-sm-9">
            <label class="form-label">分析问题 *</label>
            <input type="text" name="question" class="form-control" required
                   value="{{ session.question }}">
          </div>
          <div class="col-sm-3">
            <label class="form-label">日期</label>
            <input type="date" name="created_at" class="form-control"
                   value="{{ session.created_at }}">
          </div>
          <div class="col-12">
            <label class="form-label">主题标签</label>
            <input type="text" name="theme" class="form-control"
                   value="{{ session.theme or '' }}">
          </div>
          <div class="col-12">
            <label class="form-label">完整分析过程</label>
            <textarea name="market_context" class="form-control" rows="16"
                      style="font-size:.83rem; font-family: monospace;">{{ session.market_context or '' }}</textarea>
          </div>
        </div>
      </div>

      <div class="d-flex gap-2 mt-3">
        <button type="submit" class="btn btn-success">
          <i class="bi bi-check-circle me-1"></i>保存修改
        </button>
        <a href="{{ url_for('session_detail', session_id=session.id) }}"
           class="btn btn-outline-secondary">取消</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
